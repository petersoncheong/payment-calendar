<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Payments">
<meta name="theme-color" content="#0a64d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Payment Calendar</title>
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #0a64d6; --accent-soft: #e6f0fd; --today: #e5392d; --danger: #d92d20;
  --shadow: 0 8px 30px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989f; --line: #2e2e32;
    --accent: #4c9bff; --accent-soft: #11253f; --today: #ff6259; --danger: #ff6b60;
    --shadow: 0 8px 30px rgba(0,0,0,.7);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; }

#app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
main { flex: 1; padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); padding-top: calc(12px + env(safe-area-inset-top)); }

/* nav: bottom bar on phones, top bar on wider screens */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 8px 4px 6px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; margin: 0 0 10px; }
.right { text-align: right; }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-head .title { flex: 1; min-width: 150px; }
.cal-head h1 { font-size: 22px; }
.cal-head .sub { font-size: 13px; color: var(--muted); }
.wd, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wd div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.grid { gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cell { background: var(--card); border: 0; border-radius: 0; min-height: 60px; padding: 4px 3px; text-align: left;
  display: flex; flex-direction: column; gap: 1px; align-items: stretch; overflow: hidden; min-width: 0; }
.cell.empty { background: var(--bg); cursor: default; }
.cell .dn { font-size: 13px; font-weight: 600; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; }
.cell.today .dn { background: var(--today); color: #fff; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.cell .tot { font-size: 11px; font-weight: 700; color: var(--accent); padding-left: 2px; }
.cell .lines { display: none; flex-direction: column; gap: 1px; margin-top: 2px; }
.cell .pl { font-size: 11px; color: var(--muted); display: flex; gap: 4px; padding-left: 2px; white-space: nowrap; min-width: 0; }
.cell .pl b { color: var(--text); font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cell .pl i { font-style: normal; flex: 0 0 auto; }
@media (min-width: 700px) {
  .cell { min-height: 100px; padding: 6px; }
  .cell .lines { display: flex; }
  .cell .tot { font-size: 13px; }
}

.cal-wrap { display: block; }
@media (min-width: 900px) {
  .cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  main { padding-bottom: 24px; }
  nav { position: static; order: -1; border-top: 0; border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 16px 0; justify-content: center; }
  nav button { flex: 0 0 auto; flex-direction: row; gap: 8px; font-size: 15px; padding: 12px 20px; }
  main { padding-top: 16px; }
}
@media (min-width: 700px) and (max-width: 899px) {
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
}

/* detail panel (bottom sheet on narrow screens, side panel on wide) */
.detail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 78vh; overflow: auto;
  background: var(--card); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .22s ease; }
.detail.open { transform: none; }
.backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
.close-x { display: inline-block; }
@media (min-width: 900px) {
  .detail { position: static; transform: none; max-height: none; border-radius: 12px; box-shadow: none; border: 1px solid var(--line); }
  .backdrop, .close-x { display: none !important; }
}
.detail-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.detail-head .t { flex: 1; }
.detail-head h2 { font-size: 18px; }
.detail-total { font-size: 22px; font-weight: 700; margin: 2px 0 10px; }
.group { border-top: 1px solid var(--line); padding: 8px 0 4px; }
.group-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0;
  text-align: left; padding: 8px 6px; border-radius: 8px; }
.row:hover { background: var(--bg); }
.row .inv { color: var(--muted); font-size: 14px; }
.empty-msg { color: var(--muted); padding: 18px 0; text-align: center; }

/* lists / forms */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h3 { font-size: 16px; margin-bottom: 8px; }
.page-title { font-size: 24px; margin: 4px 0 12px; }
input[type=text], input[type=search], input[type=number], input[type=date], select {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); min-height: 44px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: flex; background: var(--line); border-radius: 10px; padding: 2px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.chk { display: flex; align-items: center; gap: 8px; margin: 10px 2px 14px; user-select: none; }
.chk input { width: 20px; height: 20px; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.past { background: var(--line); color: var(--muted); }
.date-col { min-width: 82px; font-size: 14px; color: var(--muted); }
.payee-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.payee-row:first-of-type { border-top: 0; }
.payee-row .n { flex: 1; min-width: 0; }
.payee-row .n b { display: block; overflow: hidden; text-overflow: ellipsis; }
.add-row { display: flex; gap: 8px; }
.add-row .btn { white-space: nowrap; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }

/* modal */
.modal-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 460px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
.modal h2 { font-size: 18px; margin-bottom: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin-bottom: 6px; }
@media (min-width: 700px) {
  .modal-wrap { align-items: center; }
  .modal { border-radius: 16px; box-shadow: var(--shadow); }
}
#banner { background: #b45309; color: #fff; text-align: center; font-size: 13px; font-weight: 600; padding: calc(6px + env(safe-area-inset-top)) 12px 6px; }
#banner + main { padding-top: 12px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 60; max-width: 460px; margin: 0 auto;
  background: #1c1c1e; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); }
@media (min-width: 900px) { #toast { bottom: 24px; } }
body.auth nav { display: none; }
body.auth main { padding-bottom: 24px; }
.auth-box { max-width: 380px; margin: 8vh auto 0; }
.ok { color: #1a7f37; font-size: 14px; min-height: 20px; margin-bottom: 6px; }
input[type=email], input[type=password] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); min-height: 44px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="banner" hidden>Offline — showing the last saved data. Changes can’t be saved until you’re back online.</div>
  <main id="main"></main>
  <nav id="nav">
    <button data-action="tab" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-action="tab" data-tab="lookup"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Look up</button>
    <button data-action="tab" data-tab="payees"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.4c2.2.7 3.5 2.6 3.5 5.6"/></svg>Payees</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
